# =============================================================================
# nginx reverse proxy for the Xray management panel (Phase 7)
#
# Placeholders to replace (search & replace):
#   PANEL_DOMAIN   -> your domain, e.g. panel.example.com
#   CERT_PATH      -> certificate path   (see options A / B below)
#   KEY_PATH       -> private key path
#
# HTTPS options:
#
#   OPTION A - Let's Encrypt (works for DNS-only or proxied setups):
#       sudo certbot certonly --nginx -d PANEL_DOMAIN
#       CERT_PATH = /etc/letsencrypt/live/PANEL_DOMAIN/fullchain.pem
#       KEY_PATH  = /etc/letsencrypt/live/PANEL_DOMAIN/privkey.pem
#
#   OPTION B - Cloudflare Origin Certificate (for orange-cloud/proxied setups):
#       Cloudflare Dashboard -> SSL/TLS -> Origin Server -> Create Certificate
#       Save on the server as:
#         /etc/nginx/ssl/panel-origin.pem   (Origin Certificate)
#         /etc/nginx/ssl/panel-origin.key   (Private Key)
#       And set SSL/TLS mode to "Full (strict)" on Cloudflare.
#
# The panel itself must listen ONLY on 127.0.0.1 (see deploy/install.sh);
# this file is the single public entry point. Close port 8080 in the
# firewall so nobody can bypass nginx (deploy/nginx/README has the commands).
# =============================================================================

# --- websocket upgrade map (needed only when Xray WS inbound traffic is
# --- ever proxied through this vhost; harmless for the panel alone).
# --- goes in http context: e.g. /etc/nginx/conf.d/xray-panel-map.conf
#map $http_upgrade $connection_upgrade {
#    default upgrade;
#    ''      close;
#}

# --- public HTTPS entry -------------------------------------------------------
server {
    listen 443 ssl;            # older nginx: "listen 443 ssl http2;"
    listen [::]:443 ssl;
    http2 on;                  # remove this line on nginx < 1.25
    server_name PANEL_DOMAIN;

    ssl_certificate     CERT_PATH;
    ssl_certificate_key KEY_PATH;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:xray_panel_ssl:10m;

    # Baseline browser hardening
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Give slow websocket-gRPC streams room (also covers proxied xray WS later)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Proxy to the panel on loopback; the panel port is never public,
    # nginx is the single entry point.
    proxy_pass http://127.0.0.1:8080;

    # Pass through who the real client is (Cloudflare users: pair this with
    # the mod_realip snippet in deploy/nginx/README to restore the correct IP
    # instead of 172.70.x.x CF edges).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
}

# --- HTTP to HTTPS redirect (keeps certbot http-01 working) -------------------
server {
    listen 80;
    listen [::]:80;
    server_name PANEL_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;   # certbot renewal path
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
