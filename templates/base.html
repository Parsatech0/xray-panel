<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Xray Management Panel{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a href="{{ url_for('dashboard') }}" class="brand">Xray Panel</a>
            {% if admin %}
                <nav class="nav">
                    <a href="{{ url_for('dashboard') }}">داشبورد</a>
                    <a href="{{ url_for('inbounds_list') }}">اینباند‌ها</a>
                </nav>
                <span class="user">{{ admin.username }}</span>
                <!-- Logout is a POST form (matches the POST /logout route) -->
                <form method="POST" action="{{ url_for('logout') }}" class="inline-form">
                    <button type="submit" class="btn btn-danger btn-sm">خروج</button>
                </form>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">&copy; 2026 Xray Management Panel</div>
    </footer>
</body>
</html>
